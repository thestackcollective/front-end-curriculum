# title: "Front-End Engineering Curriculum - TheStackCollective School of Software and Design"
title: "Front-End Engineering Curriculum - TheStackCollective"
# description: "Open source curriculum for the TheStackCollective School of Software and Design's front end engineering program."
description: "Open source curriculum for the TheStackCollective's front end engineering program."
# url: "http://frontend.thestackcollective.org/"
url: "http://frontend.thestackcollective.org/"

baseurl: ''
permalink: /:title

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true

exclude: [
  'Gemfile',
  'Gemfile.lock',
  'README.md',
  'LICENSE',
  'CNAME',
  'archive',
  'lessons/module-1/archive',
  'lessons/module-2/archive',
  'lessons/module-3/archive',
  'lessons/module-4/archive',
  'projects/archive'
]

defaults:
  -
    scope:
      path: ""
    values:
      layout: "page"

sass:
  style: compressed

assets:
  root_url: '/assets'

images:
  root_url: '/assets/images'

plugins:
  - jemoji
  - jekyll-algolia

algolia:
  application_id: 'OOLQ64CUYT'
  index_name:     'front-end-curriculum'
  search_only_api_key: '5b955c38c514d8e5cb906c983c8c24db'
  extensions_to_index: 'html,md'
  nodes_to_index: 'p,blockquote,li,h2,h3,h4,code.language-plaintext'
  settings:
    attributeForDistinct: 'title'
    distinct: true
  files_to_exclude:
    - _includes
    - _layouts
    - _sass
    - _site
    - _templates
    - archive/**/*
    - assets/**/*
    - books/**/*
    - calendars/**/*
    - challenges/**/*
    - lessons/module-1/archive/**/*
    - lessons/module-2/archive/**/*
    - lessons/module-3/archive/**/*
    - lessons/module-4/archive/**/*
    - mentor-posse-info/**/*
    - portal/**/*
    - postwork/**/*
    - module-0-capstone/**/*
    - professional-development/**/*
    - projects/**/*
    - public/**/*
    - stylesheets/**/*
    - today/**/*
    - index.html
